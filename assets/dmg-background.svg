<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!--
    Фон окна установочного образа .dmg (scripts/build.py, флаг «dmg»).
    Холст 640x400 pt = область окна Finder. Значки рисует сам Finder поверх фона:
    приложение — центр (160, 190), ярлык «Программы» — центр (480, 190), размер 128 pt;
    подписи значков Finder пишет под ними чёрным в обеих темах, поэтому фон светлый.
    Нижние ~60 pt могут закрыть строка пути и строка состояния Finder (их включают
    глобально, образ это не отменит), поэтому там только фон, весь текст — сверху.
    Значки не ниже y = 190: прокрутку Finder считает по значкам с подписями и отступом,
    и при 190 она не появляется даже с обеими панелями (проверено на macOS 26).
    Сборка рендерит этот файл через sips в 640x400 и 1280x800 (Retina).
  -->
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#FBF8F4"/>
      <stop offset="1" stop-color="#EEE7DE"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#paper)"/>
  <rect x="0" y="0" width="640" height="4" fill="#A8002C"/>

  <text x="320" y="56" text-anchor="middle" font-family="Helvetica Neue" font-size="19"
        font-weight="500" fill="#2A2420">Перетащите значок на папку «Программы»</text>
  <text x="320" y="82" text-anchor="middle" font-family="Helvetica Neue" font-size="12.5"
        fill="#6F655D">Если при первом запуске macOS не даёт открыть программу,</text>
  <text x="320" y="99" text-anchor="middle" font-family="Helvetica Neue" font-size="12.5"
        fill="#6F655D">разрешите её запуск в разделе безопасности Системных настроек.</text>

  <path d="M 246 196 Q 320 150 394 196" fill="none" stroke="#A8002C" stroke-width="5"
        stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M 386.2 177.6 L 394 196 L 374 197.1" fill="none" stroke="#A8002C"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
</svg>
