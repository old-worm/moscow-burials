[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moscow-burials"
dynamic = ["version"]
description = "Локальная поисковая система по массиву данных захоронений Москвы (data.mos.ru/opendata/64023)"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
build = [
    "pyinstaller==6.11.1; python_version < '3.10'",
    "pyinstaller==6.22.3; python_version >= '3.10'",
    "dmgbuild==1.6.7; sys_platform == 'darwin' and python_version >= '3.11'",
]

[project.scripts]
moscow-burials = "scripts.web:main"
moscow-burials-cli = "scripts.cli:main"
moscow-burials-build = "scripts.build:main"

[tool.setuptools]
packages = ["src", "scripts"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.package-data]
src = ["static/*"]
